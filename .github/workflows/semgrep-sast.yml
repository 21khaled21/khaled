name: Semgrep SAST Security Scan

on:
  push:
    branches: ["main", "master"]

jobs:
  semgrep-scan:
    name: Semgrep Security Analysis
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Semgrep SAST
        run: semgrep scan --config auto
